          cat > app/src/main/java/com/bayleaf/kitchen/KitchenPrinter.java <<'EOF'
          package com.bayleaf.kitchen;

          import java.io.OutputStream;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;

          public class KitchenPrinter {

              public static void print(
                      final String printerIp,
                      final String orderText,
                      final Runnable success,
                      final Runnable failure) {

                  new Thread(() -> {

                      try {

                          Socket socket = new Socket(printerIp, 9100);
                          OutputStream output = socket.getOutputStream();

                          output.write(new byte[]{0x1B, 0x40});

                          output.write(
                                  orderText.getBytes(StandardCharsets.UTF_8)
                          );

                          output.write("\n\n\n".getBytes(StandardCharsets.UTF_8));

                          output.write(new byte[]{0x1D, 0x56, 0x00});

                          output.flush();
                          output.close();
                          socket.close();

                          if (success != null) {
                              success.run();
                          }

                      } catch (Exception e) {

                          if (failure != null) {
                              failure.run();
                          }
                      }

                  }).start();
              }
          }
          EOF

